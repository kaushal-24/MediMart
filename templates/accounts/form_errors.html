{% if form.non_field_errors %}
    <div class="alert alert-danger">
        {% for error in form.non_field_errors %}
            <div>{{ error }}</div>
        {% endfor %}
    </div>
{% endif %}

{% for field in form %}
    {% for error in field.errors %}
        <div class="alert alert-danger py-2">
            <strong>{{ field.label }}:</strong> {{ error }}
        </div>
    {% endfor %}
{% endfor %}
