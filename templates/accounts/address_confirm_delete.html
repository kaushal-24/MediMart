{% extends "base.html" %}

{% block title %}Delete Address | MediMart{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="content-panel">
                <p class="eyebrow mb-2">Addresses</p>
                <h1 class="h3 fw-bold mb-3">Delete Address?</h1>
                <p class="text-secondary">
                    This will remove the address for {{ address.full_name }} in {{ address.city }}.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger" type="submit">Delete Address</button>
                        <a class="btn btn-outline-secondary" href="{% url 'accounts:address_list' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
