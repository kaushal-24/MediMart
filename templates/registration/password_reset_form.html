{% extends "base.html" %}

{% block title %}Reset Password | MediMart{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="auth-card">
                    <h1 class="h3 fw-bold mb-3">Reset Password</h1>
                    <p class="text-secondary">Enter your email address and Django will send a reset email when email settings are configured.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-success w-100" type="submit">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
