{% extends "base.html" %}

{% block title %}Set New Password | MediMart{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="auth-card">
                    <h1 class="h3 fw-bold mb-4">Set New Password</h1>
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button class="btn btn-success w-100" type="submit">Save New Password</button>
                        </form>
                    {% else %}
                        <p class="text-secondary">This reset link is invalid or has expired.</p>
                        <a class="btn btn-success" href="{% url 'accounts:password_reset' %}">Request New Link</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
