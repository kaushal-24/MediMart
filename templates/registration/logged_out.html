{% extends "base.html" %}

{% block title %}Logged Out | MediMart{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="auth-card text-center">
                    <h1 class="h3 fw-bold">You are logged out</h1>
                    <p class="text-secondary">You can log in again whenever you are ready.</p>
                    <a class="btn btn-success" href="{% url 'accounts:login' %}">Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
