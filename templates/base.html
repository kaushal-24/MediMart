{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}MediMart is a trusted marketplace for medicines, healthcare essentials, and medical equipment.{% endblock %}">
    <title>{% block title %}MediMart{% endblock %}</title>
    <script>
        (() => {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem("medimart-theme");
            } catch (error) {
                savedTheme = null;
            }
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme || (prefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-bs-theme", theme);
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=20261009-1" rel="stylesheet">
</head>
<body>
    {% include "partials/navbar.html" %}
    {% include "partials/location_modal.html" %}

    <main>
        {% include "partials/messages.html" %}
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/script.js' %}?v=20261009-1" defer></script>
</body>
</html>
