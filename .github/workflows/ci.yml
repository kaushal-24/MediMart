name: MediMart CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: medimart_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-X7q1mL9vR4kT8pN2sW6yB3dF5hJ0cZ9uA1eG7iK4oP8xV2nM6rQ
      DB_NAME: medimart_ci
      DB_USER: root
      DB_PASSWORD: test-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
        env:
          DEBUG: "False"
          FIELD_ENCRYPTION_KEY: 4x7pMViHNqd89zqtd90EWiyjpXT7Fq2Y2F7qTsa8-1M=
          ALLOWED_HOSTS: medimart.example.com
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
      - run: python manage.py test
